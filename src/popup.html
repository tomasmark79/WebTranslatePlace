<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTranslatePlace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>WebTranslatePlace</h1>
    <p id="shortcut-help">TranslatePlace (zkratka)</p>
  </header>
  <section id="discord-settings">
    <label class="toggle-row" for="discord-enabled">
      <span>Podpora překladu Discordu</span>
      <input id="discord-enabled" type="checkbox" role="switch" checked disabled>
    </label>
    <p id="discord-status" role="status" aria-live="polite"></p>
  </section>
  <form id="api-settings">
    <label for="api-url">Adresa překladového API</label>
    <input id="api-url" type="url" required placeholder="http://127.0.0.1:5001" spellcheck="false">
    <div class="actions">
      <button id="api-reset" type="button" disabled>Výchozí adresa</button>
      <button id="api-save" type="submit" disabled>Uložit</button>
    </div>
    <p id="api-status" role="status" aria-live="polite"></p>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="entries"></main>
  <footer>
    <span>Ukládá se posledních 50 překladů.</span>
    <button id="clear" type="button">Smazat vše</button>
  </footer>
  <script src="api-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
