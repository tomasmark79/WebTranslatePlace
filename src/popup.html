<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTranslatePlace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>WebTranslatePlace</h1>
    <p id="shortcut-help">TranslatePlace (shortcut)</p>
  </header>
  <section id="discord-settings">
    <label class="toggle-row" for="discord-enabled">
      <span>Discord translation</span>
      <input id="discord-enabled" type="checkbox" role="switch" checked disabled>
    </label>
    <p id="discord-status" role="status" aria-live="polite"></p>
  </section>
  <section id="translation-settings" aria-label="Translation settings">
    <form id="api-settings">
      <div class="settings-fields">
        <div>
          <label for="api-url">Translation API URL</label>
          <input id="api-url" type="url" required placeholder="http://127.0.0.1:5001" spellcheck="false">
        </div>
        <div>
          <label for="history-limit">History limit</label>
          <input id="history-limit" type="number" min="1" max="1000" step="1" value="50" required aria-describedby="history-help" disabled>
        </div>
      </div>
      <p id="history-help">1–1,000 entries. Saving a lower limit removes the oldest entries.</p>
      <div class="actions">
        <button id="api-reset" type="button" disabled hidden>Defaults</button>
        <button id="api-save" type="submit" disabled>Save</button>
      </div>
      <p id="api-status" role="status" aria-live="polite"></p>
    </form>
  </section>
  <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
  <div id="history-visibility" class="history-visibility" hidden>
    <button id="toggle-history" type="button" aria-expanded="false" aria-controls="entries">Show history</button>
  </div>
  <main id="entries" hidden></main>
  <footer>
    <div id="clear-summary" class="footer-row">
      <span id="history-count">Loading history…</span>
      <button id="clear" type="button" disabled hidden>Delete all</button>
    </div>
    <section id="clear-confirmation" aria-labelledby="clear-question" hidden>
      <p id="clear-question">Delete all saved originals and translations? This cannot be undone.</p>
      <div class="actions">
        <button id="clear-cancel" type="button">Cancel</button>
        <button id="clear-confirm" type="button">Delete all</button>
      </div>
    </section>
  </footer>
  <script src="api-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
